# Default properties.
# Localt / Render: kør med demo-profilen (H2 in-memory, ingen ekstern DB)
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
# Prod mod MySQL: sæt profilen prod og DB_URL, DB_USERNAME, DB_PASSWORD.

server.port=${PORT:8080}

spring.thymeleaf.cache=false
# open-in-view=true er bevidst (Thymeleaf læser JPA-relationer under render)

# Session (lidt sikkerhed som default)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h
server.servlet.session.tracking-modes=COOKIE

server.error.include-stacktrace=never
server.error.include-message=never
