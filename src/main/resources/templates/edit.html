<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head th:replace="~{fragments/layout :: head('Rediger ønske')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('lists')}"></header>

<main class="page">
    <div class="crumbs">
        <a th:href="@{/wishes/lists}">Mine ønskesedler</a>
        <span class="sep">/</span>
        <a th:href="@{'/wishes/viewlist/' + ${wish.wishlist.id}}" th:text="${wish.wishlist.name}">Ønskeseddel</a>
        <span class="sep">/</span>
        <span class="current">Rediger</span>
    </div>

    <div class="page-head">
        <div class="title-block">
            <span class="eyebrow sun">✏️ Rediger ønske</span>
            <h1>Opdater dit ønske</h1>
            <p class="lede">Dine ændringer gemmes med det samme og vises også på det delte link.</p>
        </div>
    </div>

    <section class="card">
        <form class="form" th:action="@{'/wish/update/' + ${wish.id}}" th:object="${wish}" method="post">
            <div class="field">
                <label for="description">Beskrivelse</label>
                <input id="description" type="text" th:field="*{description}" required>
            </div>

            <div class="form-row">
                <div class="field">
                    <label for="link">Link til varen</label>
                    <input id="link" type="url" th:field="*{link}">
                </div>
                <div class="field">
                    <label for="price">Pris (DKK)</label>
                    <input id="price" type="number" step="0.01" th:field="*{price}">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn primary">Gem ændringer</button>
                <a th:href="@{'/wishes/viewlist/' + ${wish.wishlist.id}}" class="btn ghost">Annuller</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
