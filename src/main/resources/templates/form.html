<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head th:replace="~{fragments/layout :: head('Nyt ønske')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('lists')}"></header>

<main class="page">
    <div class="crumbs">
        <a th:href="@{/wishes/lists}">Mine ønskesedler</a>
        <span class="sep">/</span>
        <a th:href="@{'/wishes/viewlist/' + ${wishlistId}}">Ønskeseddel</a>
        <span class="sep">/</span>
        <span class="current">Nyt ønske</span>
    </div>

    <div class="page-head">
        <div class="title-block">
            <span class="eyebrow">🎁 Nyt ønske</span>
            <h1>Tilføj et nyt ønske</h1>
            <p class="lede">Jo mere præcis beskrivelsen er, desto bedre match til gaven.</p>
        </div>
    </div>

    <section class="card">
        <form class="form" th:action="@{'/wish/add/' + ${wishlistId}}" th:object="${wish}" method="post">
            <div class="field">
                <label for="description">Beskrivelse</label>
                <input id="description" type="text" th:field="*{description}" required
                       placeholder="Fx 'Sony WH-1000XM5 høretelefoner, sort'">
            </div>

            <div class="form-row">
                <div class="field">
                    <label for="link">Link til varen</label>
                    <input id="link" type="url" th:field="*{link}" placeholder="https://...">
                </div>
                <div class="field">
                    <label for="price">Pris (DKK)</label>
                    <input id="price" type="number" step="0.01" th:field="*{price}" placeholder="0,00">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn primary">Gem ønske</button>
                <a th:href="@{'/wishes/viewlist/' + ${wishlistId}}" class="btn ghost">Annuller</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
