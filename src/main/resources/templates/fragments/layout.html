<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Wishlist'">Wishlist</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml"
          th:href="'data:image/svg+xml;utf8,' + '%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23e63a68%22/%3E%3Cstop offset=%221%22 stop-color=%22%23f5a524%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22url(%23g)%22/%3E%3Cpath d=%22M8 13h16v12H8z%22 fill=%22%23fff%22 opacity=%22.95%22/%3E%3Cpath d=%22M15 13h2v12h-2z%22 fill=%22%23e63a68%22/%3E%3Cpath d=%22M8 13h16v2H8z%22 fill=%22%23e63a68%22/%3E%3C/svg%3E'">
</head>
<body>

<!-- =========== Header =========== -->
<header class="site-header" th:fragment="header(active)">
    <div class="inner">
        <a th:href="@{/}" class="brand">
            <span class="mark">W</span>
            <span>Wishlist</span>
        </a>
        <nav class="site-nav" th:if="${session.currentUser != null}">
            <a th:href="@{/wishes/lists}" th:classappend="${active=='lists'} ? 'active' : ''">Mine ønskesedler</a>
        </nav>
        <nav class="site-nav" th:unless="${session.currentUser != null}">
            <a th:href="@{/}" th:classappend="${active=='home'} ? 'active' : ''">Forside</a>
        </nav>
        <div class="site-actions" th:if="${session.currentUser != null}">
            <span class="user-chip">
                <span th:text="${session.currentUser.username}">Bruger</span>
                <span class="avatar" th:text="${#strings.substring(session.currentUser.username,0,1)}">C</span>
            </span>
            <a th:href="@{/logout}" class="btn ghost sm">Log ud</a>
        </div>
        <div class="site-actions" th:unless="${session.currentUser != null}">
            <a th:href="@{/login}" class="btn ghost sm">Log ind</a>
            <a th:href="@{/register}" class="btn primary sm">Opret bruger</a>
        </div>
    </div>
</header>

<!-- =========== Footer =========== -->
<footer class="site-footer" th:fragment="footer">
    <div class="inner">
        <span>© 2025 Wishlist, Alle dine ønsker samlet ét sted</span>
        <span>Lavet med 🎁 i Danmark</span>
    </div>
</footer>

</body>
</html>
