<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head th:replace="~{fragments/layout :: head('Mine ønskesedler')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('lists')}"></header>

<main class="page">
    <div class="page-head">
        <div class="title-block">
            <h1>Mine ønskesedler</h1>
            <p class="lede">Opret, del og administrer dine ønskesedler. Hver seddel får sit eget delingslink.</p>
        </div>
    </div>

    <section class="card mb-6">
        <div class="card-head">
            <h3>Ny ønskeseddel</h3>
            <span class="eyebrow sun">🎁 Hurtig oprettelse</span>
        </div>
        <form class="form wide" th:action="@{/wishes/createList}" th:object="${newWishlist}" method="post"
              style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">
            <div class="field" style="flex:1; min-width: 260px;">
                <label for="name">Navn på ønskeseddel</label>
                <input id="name" type="text" th:field="*{name}" required placeholder="Fx 'Nyfødt baby'">
            </div>
            <button type="submit" class="btn primary">+ Opret ønskeseddel</button>
        </form>
    </section>

    <div th:if="${wishlists.isEmpty()}" class="empty">
        <span class="em">🎁</span>
        <strong>Ingen ønskesedler endnu</strong>
        <span>Lav din første ønskeseddel ovenfor, det tager under et minut.</span>
    </div>

    <div class="grid-3" th:unless="${wishlists.isEmpty()}">
        <div class="wl-card"
             th:each="list, iter : ${wishlists}"
             th:classappend="'g' + ${(iter.index % 6) + 1}"
             th:attr="data-stagger=${iter.index + 1}">
            <h3 th:text="${list.name}">Navn</h3>
            <div class="meta-row">
                <div>
                    <div class="k">Ønsker</div>
                    <div class="v" th:text="${list.wishes.size()}">0</div>
                </div>
                <div>
                    <div class="k">Reserveret</div>
                    <div class="v" th:text="${#lists.size(list.wishes.?[reserved])}">0</div>
                </div>
            </div>

            <div class="share-field">
                <input type="text" readonly
                       th:value="@{|/wishes/share/${list.shareId}|}"
                       th:id="'share-' + ${list.id}">
                <button type="button" th:onclick="|copyShare('share-${list.id}', this)|">Kopiér</button>
            </div>

            <div class="actions-row">
                <a th:href="@{'/wishes/viewlist/' + ${list.id}}" class="btn primary sm">Åbn</a>
                <a th:href="@{'/wishes/share/' + ${list.shareId}}" class="btn ghost sm" target="_blank">Vis delt</a>
                <a th:href="@{'/wishes/deletelist/' + ${list.id}}" class="btn danger sm"
                   onclick="return confirm('Slet denne ønskeseddel?');">Slet</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    function copyShare(id, btn) {
        const input = document.getElementById(id);
        const url = window.location.origin + input.value;
        navigator.clipboard.writeText(url).then(() => {
            const original = btn.textContent;
            btn.textContent = '✔ Kopieret';
            setTimeout(() => btn.textContent = original, 1600);
        });
    }
</script>

</body>
</html>
