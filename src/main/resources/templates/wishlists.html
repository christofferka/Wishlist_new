<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head th:replace="~{fragments/layout :: head('Mine ønskesedler')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('lists')}"></header>

<main class="page">
    <div class="page-head">
        <div class="title-block">
            <h1>Mine ønskesedler</h1>
            <p class="lede">Opret, del og administrer dine ønskesedler. Hver seddel får sit eget delingslink.</p>
        </div>
    </div>

    <div class="grid-3">
        <div class="wl-card"
             th:each="list, iter : ${wishlists}"
             th:classappend="'g' + ${(iter.index % 6) + 1}"
             th:attr="data-stagger=${iter.index + 1}">
            <h3 th:text="${list.name}">Navn</h3>
            <div class="meta-row">
                <div>
                    <div class="k">Ønsker</div>
                    <div class="v" th:text="${list.wishes.size()}">0</div>
                </div>
                <div>
                    <div class="k">Reserveret</div>
                    <div class="v" th:text="${#lists.size(list.wishes.?[reserved])}">0</div>
                </div>
            </div>

            <button type="button" class="share-pill"
                    th:attr="data-share=@{|/wishes/share/${list.shareId}|}"
                    onclick="copyShare(this)">
                <span class="ic">🔗</span>
                <span class="lbl">Kopiér delingslink</span>
            </button>

            <div class="actions-row">
                <a th:href="@{'/wishes/viewlist/' + ${list.id}}" class="btn primary sm">Åbn</a>
                <a th:href="@{'/wishes/share/' + ${list.shareId}}" class="btn ghost sm" target="_blank">Vis delt</a>
                <form th:action="@{'/wishes/deletelist/' + ${list.id}}" method="post"
                      style="display:inline;" onsubmit="return confirm('Slet denne ønskeseddel?');">
                    <button type="submit" class="btn danger sm">Slet</button>
                </form>
            </div>
        </div>

        <!-- Add-kort: altid synligt, åbner inline form -->
        <div class="wl-add" id="addCard">
            <form th:action="@{/wishes/createList}" th:object="${newWishlist}" method="post">
                <div class="plus-wrap">
                    <span class="plus">+</span>
                </div>
                <div class="add-title">Ny ønskeseddel</div>
                <div class="add-sub">Giv den et navn og den er klar.</div>
                <input type="text" th:field="*{name}" required
                       placeholder="Navn på ønskeseddel"
                       class="add-input">
                <button type="submit" class="btn primary sm">Opret</button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    function copyShare(btn) {
        const path = btn.getAttribute('data-share');
        const url = window.location.origin + path;
        navigator.clipboard.writeText(url).then(() => {
            const lbl = btn.querySelector('.lbl');
            const original = lbl.textContent;
            lbl.textContent = 'Kopieret!';
            btn.classList.add('ok');
            setTimeout(() => {
                lbl.textContent = original;
                btn.classList.remove('ok');
            }, 1600);
        });
    }
</script>

</body>
</html>
