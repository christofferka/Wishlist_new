<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head th:replace="~{fragments/layout :: head(${wishlist.name})}"></head>
<body>

<header th:replace="~{fragments/layout :: header('lists')}"></header>

<main class="page">
    <div class="crumbs">
        <a th:href="@{/wishes/lists}">Mine ønskesedler</a>
        <span class="sep">/</span>
        <span class="current" th:text="${wishlist.name}">Navn</span>
    </div>

    <div class="page-head">
        <div class="title-block">
            <span class="eyebrow">🎁 Ønskeseddel</span>
            <h1 th:text="${wishlist.name}">Navn</h1>
            <p class="lede">Tilføj, rediger eller slet dine ønsker. Del linket med dem, der skal give gaver.</p>
        </div>
        <div class="actions">
            <div class="share-bar">
                <span class="share-bar-label">
                    <span class="share-ic">🔗</span>
                    <span>Delingslink</span>
                </span>
                <div class="share-bar-actions">
                    <button type="button" class="share-pill" id="shareBtn"
                            th:attr="data-share=@{|/wishes/share/${wishlist.shareId}|}"
                            onclick="copyShare(this)">
                        <span class="lbl">Kopiér link</span>
                    </button>
                    <a th:href="@{'/wishes/share/' + ${wishlist.shareId}}" class="btn ghost sm" target="_blank">Åbn</a>
                </div>
            </div>
        </div>
    </div>

    <div class="grid-3">
        <article class="wish-card"
                 th:each="wish, iter : ${wishes}"
                 th:classappend="${wish.reserved} ? 'reserved' : ''"
                 th:attr="data-stagger=${iter.index + 1}">
            <span class="ribbon" th:if="${wish.reserved}">Reserveret</span>
            <div class="wish-title" th:text="${wish.description}">Beskrivelse</div>

            <a th:if="${wish.link}" th:href="${wish.link}" class="wish-link" target="_blank" rel="noopener">
                🔗 <span th:text="${wish.link}">link</span>
            </a>

            <div class="wish-price">
                <span class="num" th:text="${#numbers.formatDecimal(wish.price,1,'POINT',2,'COMMA')}">0,00</span>
                <span class="cur">kr</span>
            </div>

            <div th:if="${wish.reserved}" class="reserved-by">
                🤝 Reserveret af <span style="margin-left:4px;" th:text="${wish.reservedBy}">navn</span>
            </div>

            <div class="wish-actions">
                <a th:href="@{'/wish/edit/' + ${wish.id}}" class="btn ghost sm">Rediger</a>
                <form th:action="@{'/wish/delete/' + ${wish.id}}" method="post"
                      style="display:inline;" onsubmit="return confirm('Slet dette ønske?');">
                    <button type="submit" class="btn danger sm">Slet</button>
                </form>
            </div>
        </article>

        <!-- Add-tile: inline nyt ønske -->
        <div class="wl-add wish-add">
            <form th:action="@{'/wish/add/' + ${wishlist.id}}" method="post">
                <div class="plus-wrap">
                    <span class="plus">+</span>
                </div>
                <div class="add-title">Nyt ønske</div>
                <div class="add-sub">Beskrivelse, link og pris.</div>
                <input type="text" name="description" required
                       placeholder="Hvad ønsker du dig?"
                       class="add-input">
                <input type="url" name="link"
                       placeholder="Link (valgfrit)"
                       class="add-input">
                <input type="number" step="0.01" name="price" required
                       placeholder="Pris (kr)"
                       class="add-input">
                <button type="submit" class="btn primary sm">Tilføj ønske</button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    function copyShare(btn) {
        const path = btn.getAttribute('data-share');
        const url = window.location.origin + path;
        navigator.clipboard.writeText(url).then(() => {
            const lbl = btn.querySelector('.lbl');
            const original = lbl.textContent;
            lbl.textContent = 'Kopieret!';
            btn.classList.add('ok');
            setTimeout(() => {
                lbl.textContent = original;
                btn.classList.remove('ok');
            }, 1600);
        });
    }
</script>

</body>
</html>
