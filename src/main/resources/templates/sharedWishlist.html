<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head th:replace="~{fragments/layout :: head('Delt ønskeseddel')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('home')}"></header>

<main class="page">
    <div class="page-head">
        <div class="title-block">
            <span class="eyebrow">🎁 Delt ønskeseddel</span>
            <h1 th:text="${wishlist.name}">Ønskeseddel</h1>
            <p class="lede">
                Oprettet af <strong style="color: var(--ink);" th:text="${owner}">Navn</strong>.
                Reserver et ønske for at vise, at <em>du</em> giver det — så undgår I dobbeltgaver.
            </p>
        </div>
    </div>

    <div th:if="${wishes.isEmpty()}" class="empty">
        <span class="em">✨</span>
        <strong>Ingen ønsker endnu</strong>
        <span>Ejeren har endnu ikke tilføjet noget til denne seddel.</span>
    </div>

    <div class="grid-3" th:unless="${wishes.isEmpty()}">
        <article class="wish-card"
                 th:each="wish, iter : ${wishes}"
                 th:classappend="${wish.reserved} ? 'reserved' : ''"
                 th:attr="data-stagger=${iter.index + 1}">
            <span class="ribbon" th:if="${wish.reserved}">Reserveret</span>
            <div class="wish-title" th:text="${wish.description}">Beskrivelse</div>

            <a th:if="${wish.link}" th:href="${wish.link}" class="wish-link" target="_blank" rel="noopener">
                🔗 <span th:text="${wish.link}">link</span>
            </a>

            <div class="wish-price">
                <span class="num" th:text="${#numbers.formatDecimal(wish.price,1,'POINT',2,'COMMA')}">0,00</span>
                <span class="cur">kr</span>
            </div>

            <!-- Allerede reserveret -->
            <div th:if="${wish.reserved}" class="reserved-by">
                🤝 Reserveret af <span style="margin-left:4px;" th:text="${wish.reservedBy}">navn</span>
            </div>

            <!-- Reservations-form (gæst) -->
            <form th:unless="${wish.reserved}"
                  th:action="@{'/wishes/share/' + ${wishlist.shareId} + '/reserve/' + ${wish.id}}"
                  method="post"
                  class="wish-actions"
                  style="flex-direction: column; align-items: stretch; gap: 8px;">
                <div class="field" style="gap: 4px;">
                    <input type="text" name="name" required maxlength="40" placeholder="Dit navn, fx 'Mor'">
                </div>
                <button type="submit" class="btn primary sm">Reserver dette ønske</button>
            </form>
        </article>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
