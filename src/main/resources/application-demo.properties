# Demo-profil: H2 in-memory. Ingen ekstern DB nødvendig.
# Bruges af Render-deploy (SPRING_PROFILES_ACTIVE=demo) og lokal demo.

spring.datasource.url=jdbc:h2:mem:wishlistdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Lad Hibernate oprette skemaet ud fra entities
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Seed demo-data via DemoDataSeeder (Java). Ingen SQL-init.
spring.sql.init.mode=never

# H2-konsol slået fra på en public URL
spring.h2.console.enabled=false
